<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>QR Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* ===== Neo-brutalism theme ===== */
    :root {
      --ink: #111111;
      --paper: #FFFDF6;
      --bg: #FFD43B;
      --yellow: #FFD43B;
      --pink: #FF5C8A;
      --purple: #7B61FF;
      --green: #3CCB4A;
      --lime: #B8E33B;
      --sand: #FFE38A;
      --blue: #5AB0FF;
      --red: #FF5A4F;
      --amber: #FFB020;
      --grey: #A3A3A3;
      --muted: #555555;
      --border: 3px solid var(--ink);
      --shadow: 6px 6px 0 var(--ink);
      --shadow-sm: 4px 4px 0 var(--ink);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 0% 30%, var(--pink) 0 170px, transparent 171px),
        linear-gradient(155deg, transparent 70%, var(--purple) 70.1%);
      background-attachment: fixed;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* App "phone" card */
    .app {
      width: calc(100% - 24px);
      max-width: 720px;
      margin: 16px auto 12px;
      background: var(--paper);
      border: var(--border);
      border-radius: 28px;
      box-shadow: 10px 10px 0 var(--ink);
      padding: 18px 18px 22px;
    }
    @media (max-width: 480px) {
      .app { width: calc(100% - 20px); margin: 10px auto; padding: 14px 14px 18px; box-shadow: 7px 7px 0 var(--ink); }
    }

    /* Toolbar with square icon tiles */
    .toolbar { display: flex; align-items: center; gap: 10px; }
    .toolbar .spacer { flex: 1; }
    .tile {
      width: 48px; height: 48px; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--paper); border: var(--border); border-radius: 12px; box-shadow: var(--shadow-sm);
      color: var(--ink);
    }
    .tile svg { width: 24px; height: 24px; }
    button.tile { cursor: pointer; padding: 0; font: inherit; }
    button.tile:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.2px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 2px solid var(--ink); border-radius: 999px; padding: 4px 10px;
      font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; background: var(--paper);
    }
    .chip.live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); border: 1.5px solid var(--ink); }

    /* Hero clock */
    .hero { margin: 22px 0 6px; }
    .clock { display: block; font-size: clamp(46px, 13vw, 88px); font-weight: 900; letter-spacing: -2px; line-height: 0.95; font-variant-numeric: tabular-nums; }
    .date {
      display: inline-block; margin-top: 12px;
      background: var(--yellow); border: var(--border); border-radius: 10px; box-shadow: var(--shadow-sm);
      padding: 6px 12px; font-size: clamp(15px, 3.6vw, 19px); font-weight: 800;
    }
    .tz-note { margin: 12px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }

    /* Section headings like "My Collections" */
    .section { font-size: 19px; font-weight: 800; margin: 26px 0 12px; letter-spacing: -0.2px; }

    /* Buttons */
    .btn {
      font: inherit; font-size: 18px; font-weight: 800;
      min-height: 60px; padding: 0 20px;
      border: var(--border); border-radius: 14px; box-shadow: var(--shadow-sm);
      background: var(--paper); color: var(--ink); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      touch-action: manipulation; transition: transform 0.05s, box-shadow 0.05s;
    }
    .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn svg { width: 24px; height: 24px; }
    .btn.yellow { background: var(--yellow); }
    .btn.green { background: var(--green); }
    .btn.pink { background: var(--pink); }
    .btn.purple { background: var(--purple); color: #fff; }
    .btn.dark { background: var(--ink); color: #fff; }
    .btn.full { width: 100%; }

    /* Input like "Paste link to save" */
    .field {
      flex: 1 1 auto; min-width: 0;
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: var(--border); border-radius: 14px; box-shadow: var(--shadow-sm);
      padding: 0 14px; min-height: 64px;
    }
    .field:focus-within { box-shadow: 6px 6px 0 var(--purple); }
    .field .hash { font-size: 24px; font-weight: 900; }
    .field input {
      flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
      font: inherit; font-size: 24px; font-weight: 800; letter-spacing: 1px; color: var(--ink); padding: 12px 0;
    }
    .field input::placeholder { color: #8A8A8A; font-weight: 600; letter-spacing: 0; }
    .field input:disabled { color: #8A8A8A; }

    /* Notice */
    .notice {
      margin-top: 16px; padding: 12px 14px; font-size: 14px; font-weight: 600;
      background: var(--sand); border: var(--border); border-radius: 12px; box-shadow: var(--shadow-sm);
    }

    /* Result card */
    .result {
      margin-top: 22px; padding: 16px 18px; font-size: 18px;
      background: #fff; border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .result.loading { display: flex; align-items: center; gap: 14px; font-weight: 700; }
    .result.ok { background: #C9F5CE; }
    .result.info { background: #D6E9FF; }
    .result.error { background: #FFD3CF; }
    .result .title {
      display: inline-block; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.6px;
      background: var(--ink); color: #fff; border-radius: 6px; padding: 3px 8px; margin-bottom: 8px;
    }
    .result .name { font-size: clamp(24px, 6vw, 32px); font-weight: 900; line-height: 1.1; letter-spacing: -0.5px; }
    .result .line { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .result .msg { margin-top: 8px; line-height: 1.4; font-weight: 600; }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 4px solid var(--ink); border-right-color: var(--yellow);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Action and status chips */
    .action-badge, .status {
      display: inline-flex; align-items: center;
      border: 2px solid var(--ink); border-radius: 8px; padding: 4px 10px;
      font-weight: 800; font-size: 15px; color: var(--ink); box-shadow: 2px 2px 0 var(--ink);
    }
    .a-shift-in { background: var(--green); }
    .a-break-out { background: var(--amber); }
    .a-return-in { background: var(--blue); }
    .a-shift-out { background: var(--red); }
    .status.late { background: var(--red); }
    .status.ontime { background: var(--lime); }
    .time { font-weight: 800; font-size: 18px; }

    /* Recent list as cards */
    #recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    #recent li {
      display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap;
      background: #fff; border: var(--border); border-radius: 14px; box-shadow: var(--shadow-sm);
      padding: 12px 14px; font-size: 15px;
    }
    #recent .r-name { font-weight: 800; flex: 1 1 140px; }
    #recent .r-time { font-weight: 700; font-variant-numeric: tabular-nums; }
    #recent .action-badge, #recent .status { font-size: 13px; padding: 2px 8px; box-shadow: none; }
    #recent li.empty {
      display: block; background: transparent; box-shadow: none; border-style: dashed;
      color: var(--muted); font-weight: 600;
    }

    /* Supervisor */
    details.supervisor {
      margin-top: 22px; background: #fff; border: var(--border); border-radius: 14px; box-shadow: var(--shadow-sm); padding: 12px 14px;
    }
    details.supervisor summary { cursor: pointer; font-weight: 800; }
    .override-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    .override-grid .btn { min-height: 50px; font-size: 15px; }
    .override-note { font-size: 13px; color: var(--muted); margin: 10px 0 0; font-weight: 500; }

    footer { text-align: center; font-size: 11px; font-weight: 700; padding: 6px 16px 18px; }


    /* Scanner page */
    .app.scanner { max-width: 600px; }
    .clock.title { font-size: clamp(38px, 10vw, 56px); letter-spacing: -1.5px; }
    .btn.small { min-height: 46px; font-size: 15px; padding: 0 14px; }
    .btn.small svg { width: 20px; height: 20px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
    .row .btn { flex: 1 1 160px; }
    .viewer {
      position: relative; background: var(--ink); min-height: 300px; margin-top: 18px;
      border: var(--border); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
    }
    #reader { width: 100%; }
    #reader video { width: 100% !important; display: block; }
    .viewer .placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; text-align: center; padding: 20px; font-size: 17px; font-weight: 800;
    }
    .scan-status { margin: 16px 2px 0; font-size: 15px; font-weight: 600; color: var(--muted); min-height: 22px; }
    .diag {
      margin-top: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.45;
      background: var(--sand); border: var(--border); border-radius: 12px; box-shadow: var(--shadow-sm);
    }
    .diag b { display: block; margin-bottom: 4px; }
    .diag code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; word-break: break-word; }

    .result-box {
      margin-top: 18px; background: #fff; border: var(--border); border-radius: 20px; box-shadow: var(--shadow);
      padding: 20px; text-align: center;
    }
    .result-box .label {
      display: inline-block; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.6px;
      background: var(--ink); color: #fff; border-radius: 6px; padding: 3px 8px;
    }
    .result-box .code { font-size: clamp(38px, 12vw, 64px); font-weight: 900; margin: 12px 0 6px; word-break: break-all; letter-spacing: -1px; }
    .result-box .hint { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0; }
    .sent {
      margin-top: 18px; padding: 18px; font-size: 18px; font-weight: 800;
      background: #C9F5CE; border: var(--border); border-radius: 16px; box-shadow: var(--shadow);
    }
    #fileReader { position: absolute; left: -10000px; top: 0; width: 300px; height: 300px; }
  </style>
</head>
<body>
  <div class="app scanner">
    <div class="toolbar">
      <button class="btn small" id="backBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Back to app
      </button>
      <span class="spacer"></span>
      <span class="chip live">Camera</span>
    </div>

    <h1 class="hero"><span class="clock title">Scan your badge.</span></h1>

    <section id="scanView">
      <div class="viewer">
        <div id="reader"></div>
        <div class="placeholder" id="placeholder">Starting camera...</div>
      </div>
      <div class="row">
        <button class="btn" id="switchBtn" type="button" hidden>Switch camera</button>
        <button class="btn green" id="photoBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Take a photo
        </button>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
      <p class="scan-status" id="status">Hold the QR code inside the box.</p>
      <div class="diag" id="diag" hidden></div>
    </section>

    <section id="resultView" hidden>
      <div class="result-box">
        <span class="label">Scanned code</span>
        <div class="code" id="codeText"></div>
        <p class="hint" id="copyHint">Copy this code and paste it into the attendance app.</p>
        <div class="row">
          <button class="btn yellow" id="copyBtn" type="button">Copy</button>
          <button class="btn" id="againBtn" type="button">Scan again</button>
        </div>
      </div>
    </section>

    <section id="sentView" hidden>
      <div class="sent">Code sent to the attendance app. You can close this tab.</div>
    </section>

    <div id="fileReader" aria-hidden="true"></div>
  </div>

  <script>
    'use strict';

    // ---------------------------------------------------------------
    // Launch context: opened from the app (opener + verified origin) or on its own.
    // ---------------------------------------------------------------
    const params = new URLSearchParams(location.search);
    const NONCE = params.get('nonce') || '';
    const RAW_ORIGIN = params.get('origin') || '';
    const OPENER_ORIGIN = validateOrigin(RAW_ORIGIN);
    const LINKED = !!(window.opener && OPENER_ORIGIN && /^[A-Za-z0-9_-]{8,128}$/.test(NONCE));

    /** Only exact https://*.googleusercontent.com origins are trusted. */
    function validateOrigin(value) {
      if (!value) return '';
      try {
        const u = new URL(value);
        if (u.protocol !== 'https:') return '';
        if (u.origin !== value) return '';           // no paths, ports or tricks
        if (!/^[a-z0-9-]+(\.[a-z0-9-]+)*\.googleusercontent\.com$/i.test(u.hostname)) return '';
        return u.origin;
      } catch (e) {
        return '';
      }
    }

    const el = {
      scanView: document.getElementById('scanView'),
      resultView: document.getElementById('resultView'),
      sentView: document.getElementById('sentView'),
      placeholder: document.getElementById('placeholder'),
      status: document.getElementById('status'),
      diag: document.getElementById('diag'),
      switchBtn: document.getElementById('switchBtn'),
      photoBtn: document.getElementById('photoBtn'),
      photoInput: document.getElementById('photoInput'),
      codeText: document.getElementById('codeText'),
      copyBtn: document.getElementById('copyBtn'),
      copyHint: document.getElementById('copyHint'),
      againBtn: document.getElementById('againBtn'),
      backBtn: document.getElementById('backBtn')
    };

    let scanner = null;
    let fileScanner = null;
    let cameras = [];
    let cameraIndex = -1;
    let running = false;
    let handled = false;

    // ---------------------------------------------------------------
    // Feedback
    // ---------------------------------------------------------------
    let audioCtx = null;
    function beep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      } catch (e) { /* ignore */ }
      try { if (navigator.vibrate) navigator.vibrate(100); } catch (e) { /* ignore */ }
    }

    // ---------------------------------------------------------------
    // Live camera
    // ---------------------------------------------------------------
    const scanConfig = {
      fps: 10,
      qrbox: function (w, h) {
        const size = Math.floor(Math.min(w, h) * 0.7);
        return { width: Math.max(size, 150), height: Math.max(size, 150) };
      },
      aspectRatio: 1.0
    };

    async function startCamera(cameraConfig) {
      if (typeof Html5Qrcode === 'undefined') {
        showCameraFailure({ name: 'LibraryError', message: 'QR library did not load' });
        return;
      }
      hideDiag();
      el.placeholder.hidden = false;
      el.placeholder.textContent = 'Starting camera...';
      if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false });
      try {
        await scanner.start(cameraConfig || { facingMode: 'environment' }, scanConfig, onDecoded, function () { /* per-frame miss */ });
        running = true;
        el.placeholder.hidden = true;
        el.status.textContent = 'Hold the QR code inside the box.';
        loadCameraList();
      } catch (err) {
        running = false;
        showCameraFailure(err);
      }
    }

    async function stopCamera() {
      if (scanner && running) {
        try { await scanner.stop(); } catch (e) { /* ignore */ }
      }
      running = false;
    }

    async function loadCameraList() {
      if (cameras.length) return;
      try {
        cameras = await Html5Qrcode.getCameras();
      } catch (e) {
        cameras = [];
      }
      if (cameras.length > 1) {
        // Remember which one is the rear camera so switching starts from the right place.
        const rear = cameras.findIndex(function (c) { return /back|rear|environment/i.test(c.label || ''); });
        cameraIndex = rear >= 0 ? rear : cameras.length - 1;
        el.switchBtn.hidden = false;
      }
    }

    el.switchBtn.addEventListener('click', async function () {
      if (cameras.length < 2) return;
      el.switchBtn.disabled = true;
      cameraIndex = (cameraIndex + 1) % cameras.length;
      await stopCamera();
      await startCamera(cameras[cameraIndex].id);
      el.switchBtn.disabled = false;
    });

    function onDecoded(text) {
      if (handled) return;
      handled = true;
      beep();
      stopCamera().then(function () { deliver(text); });
    }

    // ---------------------------------------------------------------
    // Deliver a result
    // ---------------------------------------------------------------
    function deliver(text) {
      const value = String(text || '').trim();
      if (LINKED) {
        try {
          window.opener.postMessage({ type: 'qr-scan-result', text: value, nonce: NONCE }, OPENER_ORIGIN);
          el.scanView.hidden = true;
          el.sentView.hidden = false;
          setTimeout(function () { window.close(); }, 150);
          return;
        } catch (e) {
          // Opener went away: fall through to the standalone result.
        }
      }
      showStandaloneResult(value);
    }

    function showStandaloneResult(value) {
      el.codeText.textContent = value;
      el.copyHint.textContent = 'Copy this code and paste it into the attendance app.';
      el.scanView.hidden = true;
      el.resultView.hidden = false;
    }

    el.copyBtn.addEventListener('click', async function () {
      const value = el.codeText.textContent;
      try {
        await navigator.clipboard.writeText(value);
        el.copyHint.textContent = 'Copied.';
      } catch (e) {
        const range = document.createRange();
        range.selectNodeContents(el.codeText);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        el.copyHint.textContent = 'Copy was blocked. The code is selected; copy it manually.';
      }
    });

    el.againBtn.addEventListener('click', function () {
      handled = false;
      el.resultView.hidden = true;
      el.scanView.hidden = false;
      startCamera(cameraIndex >= 0 && cameras[cameraIndex] ? cameras[cameraIndex].id : null);
    });

    // ---------------------------------------------------------------
    // Photo fallback
    // ---------------------------------------------------------------
    el.photoBtn.addEventListener('click', function () {
      el.photoInput.value = '';
      el.photoInput.click();
    });

    el.photoInput.addEventListener('change', async function () {
      const file = el.photoInput.files && el.photoInput.files[0];
      if (!file) return;
      if (typeof Html5Qrcode === 'undefined') {
        el.status.textContent = 'The QR library did not load. Check the connection and reload.';
        return;
      }
      el.status.textContent = 'Reading photo...';
      await stopCamera();
      if (!fileScanner) fileScanner = new Html5Qrcode('fileReader', { verbose: false });
      try {
        const text = await fileScanner.scanFile(file, false);
        handled = true;
        beep();
        deliver(text);
      } catch (e) {
        el.status.textContent = 'No QR code found. Try again closer and with better lighting.';
        el.placeholder.hidden = false;
        el.placeholder.textContent = 'Tap "Take a photo" to try again.';
      } finally {
        el.photoInput.value = '';
      }
    });

    // ---------------------------------------------------------------
    // Back to app
    // ---------------------------------------------------------------
    el.backBtn.addEventListener('click', async function () {
      await stopCamera();
      if (LINKED) {
        try { window.opener.postMessage({ type: 'qr-scan-cancel', nonce: NONCE }, OPENER_ORIGIN); } catch (e) { /* ignore */ }
      }
      window.close();
      // If the browser refuses to close a tab it didn't open by script:
      setTimeout(function () {
        if (history.length > 1) history.back();
        else el.status.textContent = 'Close this tab to return to the attendance app.';
      }, 300);
    });

    // ---------------------------------------------------------------
    // Camera check diagnostics
    // ---------------------------------------------------------------
    const HINTS = {
      NotAllowedError: 'Camera permission was denied. Allow the camera for this site in the browser settings, then reload.',
      PermissionDeniedError: 'Camera permission was denied. Allow the camera for this site in the browser settings, then reload.',
      NotFoundError: 'No camera was found on this device.',
      DevicesNotFoundError: 'No camera was found on this device.',
      NotReadableError: 'The camera is busy in another app or tab. Close it and try again.',
      TrackStartError: 'The camera is busy in another app or tab. Close it and try again.',
      OverconstrainedError: 'The requested camera is not available. Try Switch camera.',
      SecurityError: 'The browser blocked the camera on this page. It must be opened over https and not inside a restricted frame.',
      AbortError: 'The camera stopped unexpectedly. Reload and try again.',
      NotSupportedError: 'This browser does not support live camera scanning.',
      LibraryError: 'The scanner library did not load. Check the internet connection and reload.'
    };

    function errorName(err) {
      if (!err) return 'UnknownError';
      if (typeof err === 'object' && err.name && err.name !== 'Error') return err.name;
      const text = typeof err === 'string' ? err : String(err.message || err);
      const m = /([A-Za-z]+Error)/.exec(text);
      return m ? m[1] : 'UnknownError';
    }

    async function cameraCheck() {
      let policy = 'unknown';
      try {
        if (document.permissionsPolicy && document.permissionsPolicy.allowsFeature) {
          policy = document.permissionsPolicy.allowsFeature('camera') ? 'allowed' : 'blocked';
        } else if (document.featurePolicy && document.featurePolicy.allowsFeature) {
          policy = document.featurePolicy.allowsFeature('camera') ? 'allowed' : 'blocked';
        }
      } catch (e) { policy = 'unknown'; }

      let permission = 'unknown';
      try {
        if (navigator.permissions && navigator.permissions.query) {
          const p = await navigator.permissions.query({ name: 'camera' });
          permission = p.state;
        }
      } catch (e) { permission = 'unknown'; }

      let framed = 'unknown';
      try { framed = window.self !== window.top ? 'yes' : 'no'; } catch (e) { framed = 'yes'; }

      const secure = window.isSecureContext ? 'yes' : 'no';
      const media = navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'yes' : 'no';
      return 'Camera check: policy=' + policy + ' · permission=' + permission + ' · framed=' + framed +
        ' · secure=' + secure + ' · mediaDevices=' + media;
    }

    async function showCameraFailure(err) {
      const name = errorName(err);
      const hint = HINTS[name] || 'The camera could not start.';
      el.placeholder.hidden = false;
      el.placeholder.textContent = 'Camera not available. Use "Take a photo" below.';
      el.status.textContent = 'Live scanning is not working. Tap "Take a photo" to scan from a picture instead.';
      const line = await cameraCheck();
      el.diag.replaceChildren();
      const title = document.createElement('b');
      title.textContent = name + ': ' + hint;
      const code = document.createElement('code');
      code.textContent = line;
      el.diag.appendChild(title);
      el.diag.appendChild(code);
      el.diag.hidden = false;
    }

    function hideDiag() { el.diag.hidden = true; }

    // Stop the camera when the tab is hidden or closed.
    window.addEventListener('pagehide', function () { stopCamera(); });

    // ---------------------------------------------------------------
    // Start
    // ---------------------------------------------------------------
    startCamera();
  </script>
</body>
</html>
