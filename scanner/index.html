<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>QR Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* ===== iPhone-style "Liquid Glass" theme ===== */
    :root {
      --label: #1C1C1E;
      --label-2: rgba(60, 60, 67, 0.72);
      --label-3: rgba(60, 60, 67, 0.5);
      --blue: #007AFF;
      --green: #34C759;
      --orange: #FF9500;
      --red: #FF3B30;
      --purple: #AF52DE;
      --pink: #FF2D55;
      --teal: #30B0C7;
      --glass: rgba(255, 255, 255, 0.52);
      --glass-strong: rgba(255, 255, 255, 0.72);
      --glass-edge: rgba(255, 255, 255, 0.75);
      --hairline: rgba(60, 60, 67, 0.14);
      --blur: blur(28px) saturate(180%);
      --lift: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 12px 32px rgba(31, 38, 89, 0.14), 0 2px 6px rgba(31, 38, 89, 0.06);
      --lift-sm: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 6px 16px rgba(31, 38, 89, 0.12);
      --radius: 26px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--label);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      /* Wallpaper: soft mesh gradient */
      background-color: #DCE6FF;
      background-image:
        radial-gradient(60% 50% at 12% 10%, #7FB4FF 0%, rgba(127, 180, 255, 0) 70%),
        radial-gradient(55% 45% at 92% 12%, #C9A2FF 0%, rgba(201, 162, 255, 0) 70%),
        radial-gradient(60% 55% at 88% 92%, #FFA3C8 0%, rgba(255, 163, 200, 0) 70%),
        radial-gradient(55% 50% at 8% 92%, #FFD39A 0%, rgba(255, 211, 154, 0) 70%),
        linear-gradient(160deg, #E4ECFF 0%, #F1E8FF 50%, #FFEFF3 100%);
      background-attachment: fixed;
    }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Glass material */
    .app, .tile, .chip, .field, .notice, .result, #recent li, details.supervisor, .btn {
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      :root { --glass: rgba(255, 255, 255, 0.86); --glass-strong: rgba(255, 255, 255, 0.94); }
    }

    /* App sheet */
    .app {
      width: calc(100% - 24px);
      max-width: 720px;
      margin: 16px auto 12px;
      background: var(--glass);
      border: 1px solid var(--glass-edge);
      border-radius: 34px;
      box-shadow: var(--lift);
      padding: 18px 20px 24px;
    }
    @media (max-width: 480px) {
      .app { width: calc(100% - 16px); margin: 8px auto; padding: 14px 16px 20px; border-radius: 30px; }
    }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; gap: 10px; }
    .toolbar .spacer { flex: 1; }
    .tile {
      width: 44px; height: 44px; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 14px;
      box-shadow: var(--lift-sm); color: var(--blue);
    }
    .tile svg { width: 22px; height: 22px; }
    button.tile { cursor: pointer; padding: 0; font: inherit; }
    button.tile:active { transform: scale(0.94); }
    .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.2px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 999px;
      padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--label-2); box-shadow: var(--lift-sm);
    }
    .chip.live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.22); }

    /* Lock-screen style clock */
    .hero { margin: 20px 0 4px; text-align: center; }
    .clock {
      display: block; font-size: clamp(56px, 15vw, 104px); font-weight: 700; letter-spacing: -3px; line-height: 0.95;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #1C1C1E 0%, #3A3A6A 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .date { display: block; margin-top: 10px; font-size: clamp(16px, 3.8vw, 20px); font-weight: 600; color: var(--label-2); }
    .tz-note { margin: 10px 0 0; font-size: 13px; color: var(--label-3); text-align: center; }

    .section { font-size: 20px; font-weight: 700; margin: 26px 2px 12px; letter-spacing: -0.3px; }

    /* Buttons: filled pills */
    .btn {
      font: inherit; font-size: 17px; font-weight: 600;
      min-height: 56px; padding: 0 22px;
      border: 1px solid var(--glass-edge); border-radius: 999px;
      background: var(--glass-strong); color: var(--blue); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: var(--lift-sm);
      touch-action: manipulation; transition: transform 0.12s ease, filter 0.12s ease;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); filter: brightness(0.95); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn svg { width: 22px; height: 22px; }
    .btn.yellow { background: var(--blue); color: #fff; border-color: transparent; box-shadow: 0 8px 20px rgba(0, 122, 255, 0.32); }
    .btn.green { background: linear-gradient(180deg, #3DD563 0%, #28B84C 100%); color: #fff; border-color: transparent; box-shadow: 0 8px 20px rgba(52, 199, 89, 0.32); }
    .btn.pink { background: var(--pink); color: #fff; border-color: transparent; }
    .btn.purple { background: var(--purple); color: #fff; border-color: transparent; }
    .btn.dark { background: var(--label); color: #fff; border-color: transparent; }
    .btn.full { width: 100%; }

    /* Search-field style input */
    .field {
      flex: 1 1 auto; min-width: 0;
      display: flex; align-items: center; gap: 10px;
      background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 18px;
      padding: 0 16px; min-height: 58px; box-shadow: var(--lift-sm);
      transition: box-shadow 0.15s ease;
    }
    .field:focus-within { box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.28), var(--lift-sm); }
    .field .hash { font-size: 20px; font-weight: 600; color: var(--label-3); }
    .field input {
      flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
      font: inherit; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; color: var(--label); padding: 12px 0;
    }
    .field input::placeholder { color: var(--label-3); font-weight: 500; letter-spacing: 0; }
    .field input:disabled { color: var(--label-3); }

    .notice {
      margin-top: 16px; padding: 12px 16px; font-size: 14px; font-weight: 500; line-height: 1.4;
      background: rgba(255, 204, 0, 0.22); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 18px;
    }

    /* Result card */
    .result {
      margin-top: 20px; padding: 16px 18px; font-size: 17px;
      background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 24px; box-shadow: var(--lift);
    }
    .result.loading { display: flex; align-items: center; gap: 14px; font-weight: 600; color: var(--label-2); }
    .result.ok { background: linear-gradient(135deg, rgba(52, 199, 89, 0.28), rgba(255, 255, 255, 0.78)); }
    .result.info { background: linear-gradient(135deg, rgba(0, 122, 255, 0.24), rgba(255, 255, 255, 0.78)); }
    .result.error { background: linear-gradient(135deg, rgba(255, 59, 48, 0.26), rgba(255, 255, 255, 0.78)); }
    .result .title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--label-2); margin-bottom: 4px; }
    .result .name { font-size: clamp(24px, 6vw, 32px); font-weight: 700; line-height: 1.12; letter-spacing: -0.5px; }
    .result .line { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .result .msg { margin-top: 6px; line-height: 1.4; color: var(--label-2); font-weight: 500; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(60, 60, 67, 0.18); border-top-color: var(--blue);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Capsule tags */
    .action-badge {
      display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 12px;
      font-weight: 600; font-size: 15px; color: #fff;
    }
    .a-shift-in { background: var(--green); }
    .a-break-out { background: var(--orange); }
    .a-return-in { background: var(--blue); }
    .a-shift-out { background: var(--red); }
    .status { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 15px; }
    .status.late { background: rgba(255, 59, 48, 0.15); color: #D70015; }
    .status.ontime { background: rgba(52, 199, 89, 0.18); color: #1E8E3E; }
    .time { font-weight: 600; font-size: 18px; color: var(--label-2); }

    /* Recent list: inset grouped rows */
    #recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    #recent li {
      display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap;
      background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 18px; box-shadow: var(--lift-sm);
      padding: 12px 16px; font-size: 15px;
    }
    #recent .r-name { font-weight: 600; flex: 1 1 140px; }
    #recent .r-time { color: var(--label-2); font-variant-numeric: tabular-nums; }
    #recent .action-badge, #recent .status { font-size: 13px; padding: 3px 10px; }
    #recent li.empty { display: block; color: var(--label-3); font-weight: 500; text-align: center; }

    details.supervisor {
      margin-top: 20px; background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 20px;
      box-shadow: var(--lift-sm); padding: 14px 16px;
    }
    details.supervisor summary { cursor: pointer; font-weight: 600; color: var(--label-2); }
    .override-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    .override-grid .btn { min-height: 48px; font-size: 15px; color: #fff; border-color: transparent; }
    .override-note { font-size: 13px; color: var(--label-3); margin: 10px 0 0; }

    footer { text-align: center; font-size: 11px; font-weight: 500; color: var(--label-3); padding: 6px 16px 18px; }


    /* Scanner page */
    .app.scanner { max-width: 600px; }
    .hero { text-align: left; }
    .clock.title { font-size: clamp(34px, 9vw, 48px); letter-spacing: -1.2px; }
    .btn.small { min-height: 44px; font-size: 15px; padding: 0 16px; }
    .btn.small svg { width: 18px; height: 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .row .btn { flex: 1 1 160px; }
    .viewer {
      position: relative; background: #0B0B12; min-height: 300px; margin-top: 18px;
      border-radius: 30px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6), 0 18px 40px rgba(31, 38, 89, 0.22);
    }
    #reader { width: 100%; }
    #reader video { width: 100% !important; display: block; }
    .viewer .placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.85); text-align: center; padding: 20px; font-size: 16px; font-weight: 600;
    }
    .scan-status { margin: 14px 4px 0; font-size: 15px; color: var(--label-2); min-height: 22px; text-align: center; }
    .diag {
      margin-top: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.45;
      background: rgba(255, 204, 0, 0.22); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 18px;
    }
    .diag b { display: block; margin-bottom: 4px; }
    .diag code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; word-break: break-word; color: var(--label-2); }

    .result-box {
      margin-top: 18px; padding: 22px; text-align: center;
      background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 26px; box-shadow: var(--lift);
      -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    }
    .result-box .label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--label-2); }
    .result-box .code { font-size: clamp(38px, 12vw, 64px); font-weight: 700; margin: 10px 0 6px; word-break: break-all; letter-spacing: -1px; }
    .result-box .hint { font-size: 14px; color: var(--label-3); margin: 0; }
    .sent {
      margin-top: 18px; padding: 18px; font-size: 17px; font-weight: 600; text-align: center;
      background: linear-gradient(135deg, rgba(52, 199, 89, 0.28), rgba(255, 255, 255, 0.78));
      border: 1px solid var(--glass-edge); border-radius: 22px; box-shadow: var(--lift);
    }
    #fileReader { position: absolute; left: -10000px; top: 0; width: 300px; height: 300px; }
  </style>
</head>
<body>
  <div class="app scanner">
    <div class="toolbar">
      <button class="btn small" id="backBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Back to app
      </button>
      <span class="spacer"></span>
      <span class="chip live">Camera</span>
    </div>

    <h1 class="hero"><span class="clock title">Scan your badge.</span></h1>

    <section id="scanView">
      <div class="viewer">
        <div id="reader"></div>
        <div class="placeholder" id="placeholder">Starting camera...</div>
      </div>
      <div class="row">
        <button class="btn" id="switchBtn" type="button" hidden>Switch camera</button>
        <button class="btn green" id="photoBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Take a photo
        </button>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
      <p class="scan-status" id="status">Hold the QR code inside the box.</p>
      <div class="diag" id="diag" hidden></div>
    </section>

    <section id="resultView" hidden>
      <div class="result-box">
        <span class="label">Scanned code</span>
        <div class="code" id="codeText"></div>
        <p class="hint" id="copyHint">Copy this code and paste it into the attendance app.</p>
        <div class="row">
          <button class="btn yellow" id="copyBtn" type="button">Copy</button>
          <button class="btn" id="againBtn" type="button">Scan again</button>
        </div>
      </div>
    </section>

    <section id="sentView" hidden>
      <div class="sent">Code sent to the attendance app. You can close this tab.</div>
    </section>

    <div id="fileReader" aria-hidden="true"></div>
  </div>

  <script>
    'use strict';

    // ---------------------------------------------------------------
    // Launch context: opened from the app (opener + verified origin) or on its own.
    // ---------------------------------------------------------------
    const params = new URLSearchParams(location.search);
    const NONCE = params.get('nonce') || '';
    const RAW_ORIGIN = params.get('origin') || '';
    const OPENER_ORIGIN = validateOrigin(RAW_ORIGIN);
    const LINKED = !!(window.opener && OPENER_ORIGIN && /^[A-Za-z0-9_-]{8,128}$/.test(NONCE));

    /** Only exact https://*.googleusercontent.com origins are trusted. */
    function validateOrigin(value) {
      if (!value) return '';
      try {
        const u = new URL(value);
        if (u.protocol !== 'https:') return '';
        if (u.origin !== value) return '';           // no paths, ports or tricks
        if (!/^[a-z0-9-]+(\.[a-z0-9-]+)*\.googleusercontent\.com$/i.test(u.hostname)) return '';
        return u.origin;
      } catch (e) {
        return '';
      }
    }

    const el = {
      scanView: document.getElementById('scanView'),
      resultView: document.getElementById('resultView'),
      sentView: document.getElementById('sentView'),
      placeholder: document.getElementById('placeholder'),
      status: document.getElementById('status'),
      diag: document.getElementById('diag'),
      switchBtn: document.getElementById('switchBtn'),
      photoBtn: document.getElementById('photoBtn'),
      photoInput: document.getElementById('photoInput'),
      codeText: document.getElementById('codeText'),
      copyBtn: document.getElementById('copyBtn'),
      copyHint: document.getElementById('copyHint'),
      againBtn: document.getElementById('againBtn'),
      backBtn: document.getElementById('backBtn')
    };

    let scanner = null;
    let fileScanner = null;
    let cameras = [];
    let cameraIndex = -1;
    let running = false;
    let handled = false;

    // ---------------------------------------------------------------
    // Feedback
    // ---------------------------------------------------------------
    let audioCtx = null;
    function beep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      } catch (e) { /* ignore */ }
      try { if (navigator.vibrate) navigator.vibrate(100); } catch (e) { /* ignore */ }
    }

    // ---------------------------------------------------------------
    // Live camera
    // ---------------------------------------------------------------
    const scanConfig = {
      fps: 10,
      qrbox: function (w, h) {
        const size = Math.floor(Math.min(w, h) * 0.7);
        return { width: Math.max(size, 150), height: Math.max(size, 150) };
      },
      aspectRatio: 1.0
    };

    async function startCamera(cameraConfig) {
      if (typeof Html5Qrcode === 'undefined') {
        showCameraFailure({ name: 'LibraryError', message: 'QR library did not load' });
        return;
      }
      hideDiag();
      el.placeholder.hidden = false;
      el.placeholder.textContent = 'Starting camera...';
      if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false });
      try {
        await scanner.start(cameraConfig || { facingMode: 'environment' }, scanConfig, onDecoded, function () { /* per-frame miss */ });
        running = true;
        el.placeholder.hidden = true;
        el.status.textContent = 'Hold the QR code inside the box.';
        loadCameraList();
      } catch (err) {
        running = false;
        showCameraFailure(err);
      }
    }

    async function stopCamera() {
      if (scanner && running) {
        try { await scanner.stop(); } catch (e) { /* ignore */ }
      }
      running = false;
    }

    async function loadCameraList() {
      if (cameras.length) return;
      try {
        cameras = await Html5Qrcode.getCameras();
      } catch (e) {
        cameras = [];
      }
      if (cameras.length > 1) {
        // Remember which one is the rear camera so switching starts from the right place.
        const rear = cameras.findIndex(function (c) { return /back|rear|environment/i.test(c.label || ''); });
        cameraIndex = rear >= 0 ? rear : cameras.length - 1;
        el.switchBtn.hidden = false;
      }
    }

    el.switchBtn.addEventListener('click', async function () {
      if (cameras.length < 2) return;
      el.switchBtn.disabled = true;
      cameraIndex = (cameraIndex + 1) % cameras.length;
      await stopCamera();
      await startCamera(cameras[cameraIndex].id);
      el.switchBtn.disabled = false;
    });

    function onDecoded(text) {
      if (handled) return;
      handled = true;
      beep();
      stopCamera().then(function () { deliver(text); });
    }

    // ---------------------------------------------------------------
    // Deliver a result
    // ---------------------------------------------------------------
    function deliver(text) {
      const value = String(text || '').trim();
      if (LINKED) {
        try {
          window.opener.postMessage({ type: 'qr-scan-result', text: value, nonce: NONCE }, OPENER_ORIGIN);
          el.scanView.hidden = true;
          el.sentView.hidden = false;
          setTimeout(function () { window.close(); }, 150);
          return;
        } catch (e) {
          // Opener went away: fall through to the standalone result.
        }
      }
      showStandaloneResult(value);
    }

    function showStandaloneResult(value) {
      el.codeText.textContent = value;
      el.copyHint.textContent = 'Copy this code and paste it into the attendance app.';
      el.scanView.hidden = true;
      el.resultView.hidden = false;
    }

    el.copyBtn.addEventListener('click', async function () {
      const value = el.codeText.textContent;
      try {
        await navigator.clipboard.writeText(value);
        el.copyHint.textContent = 'Copied.';
      } catch (e) {
        const range = document.createRange();
        range.selectNodeContents(el.codeText);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        el.copyHint.textContent = 'Copy was blocked. The code is selected; copy it manually.';
      }
    });

    el.againBtn.addEventListener('click', function () {
      handled = false;
      el.resultView.hidden = true;
      el.scanView.hidden = false;
      startCamera(cameraIndex >= 0 && cameras[cameraIndex] ? cameras[cameraIndex].id : null);
    });

    // ---------------------------------------------------------------
    // Photo fallback
    // ---------------------------------------------------------------
    el.photoBtn.addEventListener('click', function () {
      el.photoInput.value = '';
      el.photoInput.click();
    });

    el.photoInput.addEventListener('change', async function () {
      const file = el.photoInput.files && el.photoInput.files[0];
      if (!file) return;
      if (typeof Html5Qrcode === 'undefined') {
        el.status.textContent = 'The QR library did not load. Check the connection and reload.';
        return;
      }
      el.status.textContent = 'Reading photo...';
      await stopCamera();
      if (!fileScanner) fileScanner = new Html5Qrcode('fileReader', { verbose: false });
      try {
        const text = await fileScanner.scanFile(file, false);
        handled = true;
        beep();
        deliver(text);
      } catch (e) {
        el.status.textContent = 'No QR code found. Try again closer and with better lighting.';
        el.placeholder.hidden = false;
        el.placeholder.textContent = 'Tap "Take a photo" to try again.';
      } finally {
        el.photoInput.value = '';
      }
    });

    // ---------------------------------------------------------------
    // Back to app
    // ---------------------------------------------------------------
    el.backBtn.addEventListener('click', async function () {
      await stopCamera();
      if (LINKED) {
        try { window.opener.postMessage({ type: 'qr-scan-cancel', nonce: NONCE }, OPENER_ORIGIN); } catch (e) { /* ignore */ }
      }
      window.close();
      // If the browser refuses to close a tab it didn't open by script:
      setTimeout(function () {
        if (history.length > 1) history.back();
        else el.status.textContent = 'Close this tab to return to the attendance app.';
      }, 300);
    });

    // ---------------------------------------------------------------
    // Camera check diagnostics
    // ---------------------------------------------------------------
    const HINTS = {
      NotAllowedError: 'Camera permission was denied. Allow the camera for this site in the browser settings, then reload.',
      PermissionDeniedError: 'Camera permission was denied. Allow the camera for this site in the browser settings, then reload.',
      NotFoundError: 'No camera was found on this device.',
      DevicesNotFoundError: 'No camera was found on this device.',
      NotReadableError: 'The camera is busy in another app or tab. Close it and try again.',
      TrackStartError: 'The camera is busy in another app or tab. Close it and try again.',
      OverconstrainedError: 'The requested camera is not available. Try Switch camera.',
      SecurityError: 'The browser blocked the camera on this page. It must be opened over https and not inside a restricted frame.',
      AbortError: 'The camera stopped unexpectedly. Reload and try again.',
      NotSupportedError: 'This browser does not support live camera scanning.',
      LibraryError: 'The scanner library did not load. Check the internet connection and reload.'
    };

    function errorName(err) {
      if (!err) return 'UnknownError';
      if (typeof err === 'object' && err.name && err.name !== 'Error') return err.name;
      const text = typeof err === 'string' ? err : String(err.message || err);
      const m = /([A-Za-z]+Error)/.exec(text);
      return m ? m[1] : 'UnknownError';
    }

    async function cameraCheck() {
      let policy = 'unknown';
      try {
        if (document.permissionsPolicy && document.permissionsPolicy.allowsFeature) {
          policy = document.permissionsPolicy.allowsFeature('camera') ? 'allowed' : 'blocked';
        } else if (document.featurePolicy && document.featurePolicy.allowsFeature) {
          policy = document.featurePolicy.allowsFeature('camera') ? 'allowed' : 'blocked';
        }
      } catch (e) { policy = 'unknown'; }

      let permission = 'unknown';
      try {
        if (navigator.permissions && navigator.permissions.query) {
          const p = await navigator.permissions.query({ name: 'camera' });
          permission = p.state;
        }
      } catch (e) { permission = 'unknown'; }

      let framed = 'unknown';
      try { framed = window.self !== window.top ? 'yes' : 'no'; } catch (e) { framed = 'yes'; }

      const secure = window.isSecureContext ? 'yes' : 'no';
      const media = navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'yes' : 'no';
      return 'Camera check: policy=' + policy + ' · permission=' + permission + ' · framed=' + framed +
        ' · secure=' + secure + ' · mediaDevices=' + media;
    }

    async function showCameraFailure(err) {
      const name = errorName(err);
      const hint = HINTS[name] || 'The camera could not start.';
      el.placeholder.hidden = false;
      el.placeholder.textContent = 'Camera not available. Use "Take a photo" below.';
      el.status.textContent = 'Live scanning is not working. Tap "Take a photo" to scan from a picture instead.';
      const line = await cameraCheck();
      el.diag.replaceChildren();
      const title = document.createElement('b');
      title.textContent = name + ': ' + hint;
      const code = document.createElement('code');
      code.textContent = line;
      el.diag.appendChild(title);
      el.diag.appendChild(code);
      el.diag.hidden = false;
    }

    function hideDiag() { el.diag.hidden = true; }

    // Stop the camera when the tab is hidden or closed.
    window.addEventListener('pagehide', function () { stopCamera(); });

    // ---------------------------------------------------------------
    // Start
    // ---------------------------------------------------------------
    startCamera();
  </script>
</body>
</html>
