<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>QR Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --blue: #1F2E5E;
      --green: #41A848;
      --sapphire: #2573B0;
      --ink: #212130;
      --ink-2: #4A5166;
      --muted: #6C7487;
      --silver: #F1F1F1;
      --line: #DADDE5;
      --amber: #B7791F;
      --red: #C0392B;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--silver);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px;
    }
    header h1 { font-size: 20px; margin: 0; font-weight: 700; }
    .stroke { height: 4px; background: linear-gradient(90deg, #41A848 0%, #2573B0 55%, #47BCE7 100%); }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }

    .btn {
      font: inherit; font-size: 17px; font-weight: 700;
      min-height: 52px; padding: 0 18px;
      border-radius: 12px; border: 0; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      touch-action: manipulation;
    }
    .btn.back { background: rgba(255,255,255,0.14); color: #fff; min-height: 44px; font-size: 15px; }
    .btn.primary { background: var(--blue); color: #fff; }
    .btn.green { background: var(--green); color: #fff; }
    .btn.light { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
    .btn:disabled { opacity: 0.55; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .row .btn { flex: 1 1 160px; }

    .viewer {
      background: #000; border-radius: 16px; overflow: hidden;
      min-height: 280px; position: relative;
    }
    #reader { width: 100%; }
    #reader video { width: 100% !important; display: block; }
    .viewer .placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.8); text-align: center; padding: 20px; font-size: 16px;
    }

    .status { margin-top: 12px; font-size: 15px; color: var(--ink-2); min-height: 22px; }
    .diag {
      margin-top: 12px; padding: 12px 14px; border-radius: 12px;
      background: #FFF6E0; border-left: 5px solid var(--amber); font-size: 14px; line-height: 1.45;
    }
    .diag code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; word-break: break-word; }
    .diag b { display: block; margin-bottom: 4px; }

    .result {
      background: #fff; border-radius: 16px; padding: 20px; text-align: center;
      box-shadow: 0 6px 18px rgba(33,33,48,0.08);
    }
    .result .label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-2); }
    .result .code { font-size: clamp(36px, 12vw, 64px); font-weight: 800; color: var(--blue); margin: 8px 0 4px; word-break: break-all; }
    .result .hint { font-size: 14px; color: var(--ink-2); }
    .sent { background: #EDF7EE; border-left: 6px solid var(--green); border-radius: 12px; padding: 16px; font-size: 17px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Scan ID badge</h1>
    <button class="btn back" id="backBtn" type="button">Back to app</button>
  </header>
  <div class="stroke"></div>

  <main>
    <section id="scanView">
      <div class="viewer">
        <div id="reader"></div>
        <div class="placeholder" id="placeholder">Starting camera...</div>
      </div>
      <div class="row">
        <button class="btn light" id="switchBtn" type="button" hidden>Switch camera</button>
        <button class="btn green" id="photoBtn" type="button">Take a photo</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
      <div class="status" id="status">Hold the QR code inside the box.</div>
      <div class="diag" id="diag" hidden></div>
    </section>

    <section id="resultView" hidden>
      <div class="result">
        <div class="label">Scanned code</div>
        <div class="code" id="codeText"></div>
        <div class="hint" id="copyHint">Copy this code and paste it into the attendance app.</div>
        <div class="row">
          <button class="btn primary" id="copyBtn" type="button">Copy</button>
          <button class="btn light" id="againBtn" type="button">Scan again</button>
        </div>
      </div>
    </section>

    <section id="sentView" hidden>
      <div class="sent">Code sent to the attendance app. You can close this tab.</div>
    </section>

    <div id="fileReader" style="position:absolute;left:-10000px;top:0;width:300px;height:300px" aria-hidden="true"></div>
  </main>

  <script>
    'use strict';

    // ---------------------------------------------------------------
    // Launch context: opened from the app (opener + verified origin) or on its own.
    // ---------------------------------------------------------------
    const params = new URLSearchParams(location.search);
    const NONCE = params.get('nonce') || '';
    const RAW_ORIGIN = params.get('origin') || '';
    const OPENER_ORIGIN = validateOrigin(RAW_ORIGIN);
    const LINKED = !!(window.opener && OPENER_ORIGIN && /^[A-Za-z0-9_-]{8,128}$/.test(NONCE));

    /** Only exact https://*.googleusercontent.com origins are trusted. */
    function validateOrigin(value) {
      if (!value) return '';
      try {
        const u = new URL(value);
        if (u.protocol !== 'https:') return '';
        if (u.origin !== value) return '';           // no paths, ports or tricks
        if (!/^[a-z0-9-]+(\.[a-z0-9-]+)*\.googleusercontent\.com$/i.test(u.hostname)) return '';
        return u.origin;
      } catch (e) {
        return '';
      }
    }

    const el = {
      scanView: document.getElementById('scanView'),
      resultView: document.getElementById('resultView'),
      sentView: document.getElementById('sentView'),
      placeholder: document.getElementById('placeholder'),
      status: document.getElementById('status'),
      diag: document.getElementById('diag'),
      switchBtn: document.getElementById('switchBtn'),
      photoBtn: document.getElementById('photoBtn'),
      photoInput: document.getElementById('photoInput'),
      codeText: document.getElementById('codeText'),
      copyBtn: document.getElementById('copyBtn'),
      copyHint: document.getElementById('copyHint'),
      againBtn: document.getElementById('againBtn'),
      backBtn: document.getElementById('backBtn')
    };

    let scanner = null;
    let fileScanner = null;
    let cameras = [];
    let cameraIndex = -1;
    let running = false;
    let handled = false;

    // ---------------------------------------------------------------
    // Feedback
    // ---------------------------------------------------------------
    let audioCtx = null;
    function beep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      } catch (e) { /* ignore */ }
      try { if (navigator.vibrate) navigator.vibrate(100); } catch (e) { /* ignore */ }
    }

    // ---------------------------------------------------------------
    // Live camera
    // ---------------------------------------------------------------
    const scanConfig = {
      fps: 10,
      qrbox: function (w, h) {
        const size = Math.floor(Math.min(w, h) * 0.7);
        return { width: Math.max(size, 150), height: Math.max(size, 150) };
      },
      aspectRatio: 1.0
    };

    async function startCamera(cameraConfig) {
      if (typeof Html5Qrcode === 'undefined') {
        showCameraFailure({ name: 'LibraryError', message: 'QR library did not load' });
        return;
      }
      hideDiag();
      el.placeholder.hidden = false;
      el.placeholder.textContent = 'Starting camera...';
      if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false });
      try {
        await scanner.start(cameraConfig || { facingMode: 'environment' }, scanConfig, onDecoded, function () { /* per-frame miss */ });
        running = true;
        el.placeholder.hidden = true;
        el.status.textContent = 'Hold the QR code inside the box.';
        loadCameraList();
      } catch (err) {
        running = false;
        showCameraFailure(err);
      }
    }

    async function stopCamera() {
      if (scanner && running) {
        try { await scanner.stop(); } catch (e) { /* ignore */ }
      }
      running = false;
    }

    async function loadCameraList() {
      if (cameras.length) return;
      try {
        cameras = await Html5Qrcode.getCameras();
      } catch (e) {
        cameras = [];
      }
      if (cameras.length > 1) {
        // Remember which one is the rear camera so switching starts from the right place.
        const rear = cameras.findIndex(function (c) { return /back|rear|environment/i.test(c.label || ''); });
        cameraIndex = rear >= 0 ? rear : cameras.length - 1;
        el.switchBtn.hidden = false;
      }
    }

    el.switchBtn.addEventListener('click', async function () {
      if (cameras.length < 2) return;
      el.switchBtn.disabled = true;
      cameraIndex = (cameraIndex + 1) % cameras.length;
      await stopCamera();
      await startCamera(cameras[cameraIndex].id);
      el.switchBtn.disabled = false;
    });

    function onDecoded(text) {
      if (handled) return;
      handled = true;
      beep();
      stopCamera().then(function () { deliver(text); });
    }

    // ---------------------------------------------------------------
    // Deliver a result
    // ---------------------------------------------------------------
    function deliver(text) {
      const value = String(text || '').trim();
      if (LINKED) {
        try {
          window.opener.postMessage({ type: 'qr-scan-result', text: value, nonce: NONCE }, OPENER_ORIGIN);
          el.scanView.hidden = true;
          el.sentView.hidden = false;
          setTimeout(function () { window.close(); }, 150);
          return;
        } catch (e) {
          // Opener went away: fall through to the standalone result.
        }
      }
      showStandaloneResult(value);
    }

    function showStandaloneResult(value) {
      el.codeText.textContent = value;
      el.copyHint.textContent = 'Copy this code and paste it into the attendance app.';
      el.scanView.hidden = true;
      el.resultView.hidden = false;
    }

    el.copyBtn.addEventListener('click', async function () {
      const value = el.codeText.textContent;
      try {
        await navigator.clipboard.writeText(value);
        el.copyHint.textContent = 'Copied.';
      } catch (e) {
        const range = document.createRange();
        range.selectNodeContents(el.codeText);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        el.copyHint.textContent = 'Copy was blocked. The code is selected; copy it manually.';
      }
    });

    el.againBtn.addEventListener('click', function () {
      handled = false;
      el.resultView.hidden = true;
      el.scanView.hidden = false;
      startCamera(cameraIndex >= 0 && cameras[cameraIndex] ? cameras[cameraIndex].id : null);
    });

    // ---------------------------------------------------------------
    // Photo fallback
    // ---------------------------------------------------------------
    el.photoBtn.addEventListener('click', function () {
      el.photoInput.value = '';
      el.photoInput.click();
    });

    el.photoInput.addEventListener('change', async function () {
      const file = el.photoInput.files && el.photoInput.files[0];
      if (!file) return;
      if (typeof Html5Qrcode === 'undefined') {
        el.status.textContent = 'The QR library did not load. Check the connection and reload.';
        return;
      }
      el.status.textContent = 'Reading photo...';
      await stopCamera();
      if (!fileScanner) fileScanner = new Html5Qrcode('fileReader', { verbose: false });
      try {
        const text = await fileScanner.scanFile(file, false);
        handled = true;
        beep();
        deliver(text);
      } catch (e) {
        el.status.textContent = 'No QR code found. Try again closer and with better lighting.';
        el.placeholder.hidden = false;
        el.placeholder.textContent = 'Tap "Take a photo" to try again.';
      } finally {
        el.photoInput.value = '';
      }
    });

    // ---------------------------------------------------------------
    // Back to app
    // ---------------------------------------------------------------
    el.backBtn.addEventListener('click', async function () {
      await stopCamera();
      if (LINKED) {
        try { window.opener.postMessage({ type: 'qr-scan-cancel', nonce: NONCE }, OPENER_ORIGIN); } catch (e) { /* ignore */ }
      }
      window.close();
      // If the browser refuses to close a tab it didn't open by script:
      setTimeout(function () {
        if (history.length > 1) history.back();
        else el.status.textContent = 'Close this tab to return to the attendance app.';
      }, 300);
    });

    // ---------------------------------------------------------------
    // Camera check diagnostics
    // ---------------------------------------------------------------
    const HINTS = {
      NotAllowedError: 'Camera permission was denied. Allow the camera for this site in the browser settings, then reload.',
      PermissionDeniedError: 'Camera permission was denied. Allow the camera for this site in the browser settings, then reload.',
      NotFoundError: 'No camera was found on this device.',
      DevicesNotFoundError: 'No camera was found on this device.',
      NotReadableError: 'The camera is busy in another app or tab. Close it and try again.',
      TrackStartError: 'The camera is busy in another app or tab. Close it and try again.',
      OverconstrainedError: 'The requested camera is not available. Try Switch camera.',
      SecurityError: 'The browser blocked the camera on this page. It must be opened over https and not inside a restricted frame.',
      AbortError: 'The camera stopped unexpectedly. Reload and try again.',
      NotSupportedError: 'This browser does not support live camera scanning.',
      LibraryError: 'The scanner library did not load. Check the internet connection and reload.'
    };

    function errorName(err) {
      if (!err) return 'UnknownError';
      if (typeof err === 'object' && err.name && err.name !== 'Error') return err.name;
      const text = typeof err === 'string' ? err : String(err.message || err);
      const m = /([A-Za-z]+Error)/.exec(text);
      return m ? m[1] : 'UnknownError';
    }

    async function cameraCheck() {
      let policy = 'unknown';
      try {
        if (document.permissionsPolicy && document.permissionsPolicy.allowsFeature) {
          policy = document.permissionsPolicy.allowsFeature('camera') ? 'allowed' : 'blocked';
        } else if (document.featurePolicy && document.featurePolicy.allowsFeature) {
          policy = document.featurePolicy.allowsFeature('camera') ? 'allowed' : 'blocked';
        }
      } catch (e) { policy = 'unknown'; }

      let permission = 'unknown';
      try {
        if (navigator.permissions && navigator.permissions.query) {
          const p = await navigator.permissions.query({ name: 'camera' });
          permission = p.state;
        }
      } catch (e) { permission = 'unknown'; }

      let framed = 'unknown';
      try { framed = window.self !== window.top ? 'yes' : 'no'; } catch (e) { framed = 'yes'; }

      const secure = window.isSecureContext ? 'yes' : 'no';
      const media = navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'yes' : 'no';
      return 'Camera check: policy=' + policy + ' · permission=' + permission + ' · framed=' + framed +
        ' · secure=' + secure + ' · mediaDevices=' + media;
    }

    async function showCameraFailure(err) {
      const name = errorName(err);
      const hint = HINTS[name] || 'The camera could not start.';
      el.placeholder.hidden = false;
      el.placeholder.textContent = 'Camera not available. Use "Take a photo" below.';
      el.status.textContent = 'Live scanning is not working. Tap "Take a photo" to scan from a picture instead.';
      const line = await cameraCheck();
      el.diag.replaceChildren();
      const title = document.createElement('b');
      title.textContent = name + ': ' + hint;
      const code = document.createElement('code');
      code.textContent = line;
      el.diag.appendChild(title);
      el.diag.appendChild(code);
      el.diag.hidden = false;
    }

    function hideDiag() { el.diag.hidden = true; }

    // Stop the camera when the tab is hidden or closed.
    window.addEventListener('pagehide', function () { stopCamera(); });

    // ---------------------------------------------------------------
    // Start
    // ---------------------------------------------------------------
    startCamera();
  </script>
</body>
</html>
